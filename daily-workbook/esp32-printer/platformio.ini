; Workbook printer: holds a week of print files on a microSD card and sends
; each morning's to the HP over Wi-Fi (IPP). See README.md.
;
; Any ESP32 works — printing is over the network, not USB. Build for the board
; you have:   pio run -e esp32-s3 -t upload     or     pio run -e esp32 -t upload

[platformio]
default_envs = esp32-s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32]
board = esp32dev
